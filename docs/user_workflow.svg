<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 540" width="100%" height="100%" style="background:#ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="wfShadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.07" />
    </filter>
    <marker id="wfArrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#334155" />
    </marker>
    <marker id="wfArrowRed" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ef4444" />
    </marker>
    <marker id="wfArrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a" />
    </marker>
  </defs>

  <!-- Frame -->
  <rect x="15" y="15" width="1090" height="510" rx="12" fill="#fafafa" stroke="#e2e8f0" stroke-width="1.5" />
  <text x="40" y="44" fill="#0f172a" font-size="16" font-weight="700" letter-spacing="0.3">APPLICATION WORKFLOW &amp; USER JOURNEY</text>
  <text x="40" y="64" fill="#64748b" font-size="12">End-to-end navigational routing, authentication gating, prediction evaluation, and account administration lifecycle</text>

  <!-- ================= NODES ================= -->

  <!-- Start Circle -->
  <circle cx="65" cy="210" r="28" fill="#fef08a" stroke="#ca8a04" stroke-width="1.5" filter="url(#wfShadow)" />
  <text x="65" y="215" fill="#713f12" font-size="12" font-weight="700" text-anchor="middle">Start</text>

  <!-- Home Page / Landing Page -->
  <rect x="125" y="185" width="95" height="50" rx="8" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.5" filter="url(#wfShadow)" />
  <text x="172" y="206" fill="#14532d" font-size="10" font-weight="700" text-anchor="middle">Home Page /</text>
  <text x="172" y="222" fill="#14532d" font-size="10" font-weight="700" text-anchor="middle">Landing Page</text>

  <!-- Register Page -->
  <rect x="255" y="185" width="85" height="50" rx="8" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.5" filter="url(#wfShadow)" />
  <text x="297" y="214" fill="#14532d" font-size="11" font-weight="700" text-anchor="middle">Register Page</text>

  <!-- Log In Page -->
  <rect x="255" y="290" width="85" height="50" rx="8" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.5" filter="url(#wfShadow)" />
  <text x="297" y="320" fill="#14532d" font-size="11" font-weight="700" text-anchor="middle">Log In Page</text>

  <!-- Dashboard -->
  <rect x="375" y="240" width="80" height="50" rx="8" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.5" filter="url(#wfShadow)" />
  <text x="415" y="270" fill="#14532d" font-size="11" font-weight="700" text-anchor="middle">Dashboard</text>

  <!-- Prediction Page -->
  <rect x="485" y="240" width="85" height="50" rx="8" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.5" filter="url(#wfShadow)" />
  <text x="527" y="262" fill="#14532d" font-size="11" font-weight="700" text-anchor="middle">Prediction</text>
  <text x="527" y="278" fill="#14532d" font-size="11" font-weight="700" text-anchor="middle">Page</text>

  <!-- Diamond: Start Prediction? -->
  <polygon points="650,235 695,265 650,295 605,265" fill="#fca5a5" stroke="#ef4444" stroke-width="1.5" filter="url(#wfShadow)" />
  <text x="650" y="262" fill="#7f1d1d" font-size="9" font-weight="700" text-anchor="middle">Start</text>
  <text x="650" y="274" fill="#7f1d1d" font-size="9" font-weight="700" text-anchor="middle">Prediction?</text>

  <!-- Results Page -->
  <rect x="735" y="160" width="80" height="50" rx="8" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.5" filter="url(#wfShadow)" />
  <text x="775" y="190" fill="#14532d" font-size="11" font-weight="700" text-anchor="middle">Results Page</text>

  <!-- History Page -->
  <rect x="845" y="160" width="80" height="50" rx="8" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.5" filter="url(#wfShadow)" />
  <text x="885" y="190" fill="#14532d" font-size="11" font-weight="700" text-anchor="middle">History Page</text>

  <!-- Store Result in History -->
  <rect x="955" y="160" width="85" height="50" rx="8" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.5" filter="url(#wfShadow)" />
  <text x="997" y="182" fill="#14532d" font-size="9" font-weight="700" text-anchor="middle">Store Result</text>
  <text x="997" y="198" fill="#14532d" font-size="9" font-weight="700" text-anchor="middle">in History</text>

  <!-- Delete Account? -->
  <rect x="845" y="75" width="80" height="46" rx="8" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.5" filter="url(#wfShadow)" />
  <text x="885" y="96" fill="#14532d" font-size="10" font-weight="700" text-anchor="middle">Delete</text>
  <text x="885" y="110" fill="#14532d" font-size="10" font-weight="700" text-anchor="middle">Account?</text>

  <!-- Confirm Deletion -->
  <rect x="955" y="75" width="85" height="46" rx="8" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.5" filter="url(#wfShadow)" />
  <text x="997" y="96" fill="#14532d" font-size="10" font-weight="700" text-anchor="middle">Confirm</text>
  <text x="997" y="110" fill="#14532d" font-size="10" font-weight="700" text-anchor="middle">Deletion</text>

  <!-- Profile Page -->
  <rect x="735" y="325" width="80" height="50" rx="8" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.5" filter="url(#wfShadow)" />
  <text x="775" y="355" fill="#14532d" font-size="11" font-weight="700" text-anchor="middle">Profile Page</text>

  <!-- Update User Info? -->
  <rect x="845" y="325" width="85" height="50" rx="8" fill="#fca5a5" stroke="#ef4444" stroke-width="1.5" filter="url(#wfShadow)" />
  <text x="887" y="347" fill="#7f1d1d" font-size="10" font-weight="700" text-anchor="middle">Update User</text>
  <text x="887" y="363" fill="#7f1d1d" font-size="10" font-weight="700" text-anchor="middle">Info?</text>

  <!-- Save Changes -->
  <rect x="955" y="325" width="85" height="50" rx="8" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.5" filter="url(#wfShadow)" />
  <text x="997" y="355" fill="#14532d" font-size="10" font-weight="700" text-anchor="middle">Save Changes</text>

  <!-- Support Page -->
  <rect x="735" y="420" width="80" height="50" rx="8" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.5" filter="url(#wfShadow)" />
  <text x="775" y="450" fill="#14532d" font-size="11" font-weight="700" text-anchor="middle">Support Page</text>

  <!-- Display Error Message -->
  <rect x="615" y="375" width="90" height="46" rx="8" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.5" filter="url(#wfShadow)" />
  <text x="660" y="396" fill="#14532d" font-size="10" font-weight="700" text-anchor="middle">Display Error</text>
  <text x="660" y="410" fill="#14532d" font-size="10" font-weight="700" text-anchor="middle">Message</text>

  <!-- End Circle -->
  <circle cx="1065" cy="270" r="24" fill="#fef08a" stroke="#ca8a04" stroke-width="1.5" filter="url(#wfShadow)" />
  <text x="1065" y="275" fill="#713f12" font-size="12" font-weight="700" text-anchor="middle">End</text>

  <!-- ================= ARROWS & FLOW PATHS ================= -->

  <!-- Start -> Home -->
  <line x1="93" y1="210" x2="120" y2="210" stroke="#334155" stroke-width="1.5" marker-end="url(#wfArrow)" />

  <!-- Home -> Register -->
  <line x1="220" y1="210" x2="250" y2="210" stroke="#334155" stroke-width="1.5" marker-end="url(#wfArrow)" />

  <!-- Home -> Login (Down then Right) -->
  <path d="M 172 235 L 172 315 L 250 315" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#wfArrow)" />

  <!-- Register & Login -> Dashboard -->
  <path d="M 340 210 L 358 210 L 358 265 L 370 265" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#wfArrow)" />
  <path d="M 340 315 L 358 315 L 358 265 L 370 265" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#wfArrow)" />

  <!-- Dashboard -> Prediction Page -->
  <line x1="455" y1="265" x2="480" y2="265" stroke="#334155" stroke-width="1.5" marker-end="url(#wfArrow)" />

  <!-- Prediction Page -> Start Prediction? -->
  <line x1="570" y1="265" x2="600" y2="265" stroke="#334155" stroke-width="1.5" marker-end="url(#wfArrow)" />

  <!-- Start Prediction -> Yes (Up then Right) -> Results Page -->
  <path d="M 650 235 L 650 185 L 730 185" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#wfArrowGreen)" />
  <text x="658" y="200" fill="#16a34a" font-size="10" font-weight="700">Yes</text>

  <!-- Start Prediction -> No (Down then Left) -> Display Error Message -->
  <path d="M 650 295 L 650 370" fill="none" stroke="#ef4444" stroke-width="1.5" marker-end="url(#wfArrowRed)" />
  <text x="658" y="320" fill="#ef4444" font-size="10" font-weight="700">No</text>

  <!-- Results Page -> History Page -->
  <line x1="815" y1="185" x2="840" y2="185" stroke="#334155" stroke-width="1.5" marker-end="url(#wfArrow)" />

  <!-- History Page -> Store Result in History -->
  <line x1="925" y1="185" x2="950" y2="185" stroke="#334155" stroke-width="1.5" marker-end="url(#wfArrow)" />

  <!-- History Page -> Delete Account? -->
  <path d="M 885 160 L 885 125" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#wfArrow)" />

  <!-- Delete Account? -> Confirm Deletion -->
  <line x1="925" y1="98" x2="950" y2="98" stroke="#334155" stroke-width="1.5" marker-end="url(#wfArrow)" />

  <!-- History Page -> Profile Page -->
  <path d="M 865 210 L 865 290 L 775 290 L 775 320" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#wfArrow)" />

  <!-- Profile Page -> Update User Info? -->
  <line x1="815" y1="350" x2="840" y2="350" stroke="#334155" stroke-width="1.5" marker-end="url(#wfArrow)" />

  <!-- Update User Info? -> Save Changes -->
  <line x1="930" y1="350" x2="950" y2="350" stroke="#334155" stroke-width="1.5" marker-end="url(#wfArrow)" />

  <!-- Profile Page -> Support Page -->
  <line x1="775" y1="375" x2="775" y2="415" stroke="#334155" stroke-width="1.5" marker-end="url(#wfArrow)" />

  <!-- End Connections -->
  <path d="M 1040 185 L 1055 185 L 1055 250" fill="none" stroke="#334155" stroke-width="1.5" />
  <path d="M 1040 98 L 1065 98 L 1065 242" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#wfArrow)" />
  <path d="M 1040 350 L 1065 350 L 1065 298" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#wfArrow)" />
  <path d="M 705 398 L 1050 398 L 1050 290" fill="none" stroke="#334155" stroke-width="1.5" />

</svg>
